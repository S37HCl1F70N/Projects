[core]
database_path = "/var/lib/network-black-box/network-black-box.db"
state_dir = "/var/lib/network-black-box"
log_dir = "/var/log/network-black-box"

[monitoring]
interfaces = ["auto"]
networks = ["auto"]
observation_mode = "auto"
neighbor_interval_seconds = 30
device_refresh_seconds = 120
observation_history_seconds = 900
offline_after_seconds = 300
returned_after_seconds = 3600
active_scan = false
active_scan_interval_seconds = 300
active_scan_timeout_seconds = 1
capture = true
capture_snaplen = 256
capture_filter = "arp or ip or ip6"
flow_bucket_seconds = 60
flow_flush_seconds = 30
bandwidth_sample_seconds = 10
capture_dns = true
capture_mdns = true
capture_dhcp = true
store_destination_ips = true

[web]
bind = "0.0.0.0"
port = 8088
auth_enabled = true
auth_file = "/etc/network-black-box/dashboard.auth"
allow_private_clients_only = true

[retention]
dns_days = 30
flows_days = 30
bandwidth_days = 90
observations_days = 30
events_days = 180
health_days = 30
vacuum_min_interval_days = 7

[health]
sample_seconds = 60
disk_free_warn_mb = 1024
disk_free_critical_mb = 512
collector_stale_seconds = 120

[logging]
level = "INFO"
max_bytes = 5242880
backup_count = 3
