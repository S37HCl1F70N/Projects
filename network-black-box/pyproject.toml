[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-black-box"
version = "0.1.0"
description = "Lightweight persistent network telemetry appliance for Linux and Raspberry Pi"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
network-black-box = "nbb.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
